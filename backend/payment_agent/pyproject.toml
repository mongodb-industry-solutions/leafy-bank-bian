[tool.poetry]
name = "payment-agent"
version = "0.1.0"
description = "Phase-1 Reconciliation Agent for the Leafy Bank payment workflow — a change-stream-triggered LangGraph agent over Bedrock (Haiku). Investigates reconciliation discrepancies; writes only exceptions.agent{}."
authors = ["Leafy Bank"]

[tool.poetry.dependencies]
python = ">=3.10,<3.11"
pymongo = "^4.10.1"
python-dotenv = "^1.0.1"
fastapi = "^0.115.4"
uvicorn = "^0.32.0"
# Agent stack — lives here, NOT on the money-path transactions service.
langgraph = "^1.0.10"
langchain = "^1.3.9"
langchain-aws = "^1.2.5"
langgraph-checkpoint-mongodb = "^0.3.1"
voyageai = "^0.3.7"
boto3 = "^1.42.66"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
