      repo: industrysolutions/open-finance-nextgen-ui
      tags:
        - git-${DRONE_COMMIT_SHA:0:7}
        - latest
      dockerfile: Dockerfile.frontend
      build_args:
        - BIAN_MODEL_URL=https://fsi-bian-model.industrysolutions.staging.corp.mongodb.com
      access_key:
        from_secret: ecr_access_key
      secret_key:
        from_secret: ecr_secret_key
    when:
      event:
        - push

  - name: publish-bian-model
    image: plugins/kaniko-ecr
