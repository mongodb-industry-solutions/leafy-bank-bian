####################################################################
# Leafy Bank Core Banking — consolidated monorepo pipeline
#
# One repo, four pods. Each push to `staging` / `main` builds all
# four images and deploys all four Helm releases (separate pods).
# Service names, ECR repos, ingress hosts, chart versions and
# resources are preserved verbatim from the original repos.
####################################################################

---
########################
# PR validation
########################
kind: pipeline
type: kubernetes
name: validate-pr

trigger:
  event:
    - pull_request
  branch:
    - staging
    - main

steps:
  - name: secret-scan
    image: zricethezav/gitleaks:latest
    commands:
      - gitleaks detect --source . --verbose
    when:
      event:
        - pull_request

  - name: dependency-scan
    image: ghcr.io/aquasecurity/trivy:0.69.3
    commands:
      - trivy fs --severity CRITICAL --exit-code 1 .
    when:
      event:
        - pull_request

  - name: lint-frontend
    image: node:22-alpine
    commands:
      - cd frontend && npm install && npx eslint .
    when:
      event:
        - pull_request

  - name: build-check-frontend
    image: plugins/kaniko-ecr
    settings:
      no_push: true
      registry: 795250896452.dkr.ecr.us-east-1.amazonaws.com
      repo: industrysolutions/open-finance-nextgen-ui
      dockerfile: Dockerfile.frontend
    when:
      event:
        - pull_request

  - name: build-check-bian-model
    image: plugins/kaniko-ecr
    settings:
      no_push: true
      registry: 795250896452.dkr.ecr.us-east-1.amazonaws.com
      repo: industrysolutions/fsi-bian-model
      dockerfile: Dockerfile.bian-model
    when:
      event:
        - pull_request

  - name: build-check-accounts
    image: plugins/kaniko-ecr
    settings:
      no_push: true
      registry: 795250896452.dkr.ecr.us-east-1.amazonaws.com
      repo: industrysolutions/leafy-bank-backend-accounts
      dockerfile: Dockerfile.accounts
    when:
      event:
        - pull_request

  - name: build-check-transactions
    image: plugins/kaniko-ecr
    settings:
      no_push: true
      registry: 795250896452.dkr.ecr.us-east-1.amazonaws.com
      repo: industrysolutions/leafy-bank-backend-transactions
      dockerfile: Dockerfile.transactions
    when:
      event:
        - pull_request

  - name: build-check-ledger
    image: plugins/kaniko-ecr
    settings:
      no_push: true
      registry: 795250896452.dkr.ecr.us-east-1.amazonaws.com
      repo: industrysolutions/leafy-bank-backend-ledger
      dockerfile: Dockerfile.ledger
    when:
      event:
        - pull_request

---
########################
# STAGING (branch: staging)
########################
