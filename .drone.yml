####################################################################
# Leafy Bank Core Banking — consolidated monorepo pipeline
#
# One repo, four pods. Each push to `staging` / `main` builds and
# deploys only the services whose source files changed.
#
# Path filtering rules (per service):
#   frontend     → frontend/**  Dockerfile.frontend
#   bian-model   → bian-model/**  Dockerfile.bian-model
#   accounts     → backend/accounts/**  Dockerfile.accounts
#   transactions → backend/transactions/**  Dockerfile.transactions
#   ledger       → backend/ledger/**  Dockerfile.ledger
#
# environment/staging.yaml or environment/production.yaml changes
# trigger ALL services (shared Helm values — any change affects all).
####################################################################

---
########################
# PR validation
########################
kind: pipeline
type: kubernetes
name: validate-pr

trigger:
  event:
    - pull_request
  branch:
    - staging
    - main

steps:
  # Security gates run on every PR regardless of which files changed.
  - name: secret-scan
    image: zricethezav/gitleaks:latest
    commands:
      - gitleaks detect --source . --verbose
    when:
      event:
        - pull_request

  - name: dependency-scan
    image: ghcr.io/aquasecurity/trivy:0.69.3
    commands:
      - trivy fs --severity CRITICAL --exit-code 1 .
    when:
      event:
        - pull_request

  # - name: lint-frontend
  #   image: node:22-alpine
  #   commands:
  #     - cd frontend && npm install && npx eslint .
  #   when:
  #     event:
  #       - pull_request
  #     paths:
  #       include:
  #         - "frontend/**"
  #         - "Dockerfile.frontend"

  - name: build-check-frontend
    image: plugins/kaniko-ecr
    settings:
      no_push: true
      registry: 795250896452.dkr.ecr.us-east-1.amazonaws.com
      repo: industrysolutions/leafy-bank-bian-ui
      dockerfile: Dockerfile.frontend
    when:
      event:
        - pull_request
      paths:
        include:
          - "frontend/**"
          - "Dockerfile.frontend"

  - name: build-check-bian-model
    image: plugins/kaniko-ecr
    settings:
      no_push: true
      registry: 795250896452.dkr.ecr.us-east-1.amazonaws.com
      repo: industrysolutions/leafy-bank-bian-model
      dockerfile: Dockerfile.bian-model
    when:
      event:
        - pull_request
      paths:
        include:
          - "bian-model/**"
          - "Dockerfile.bian-model"

  - name: build-check-accounts
    image: plugins/kaniko-ecr
    settings:
      no_push: true
      registry: 795250896452.dkr.ecr.us-east-1.amazonaws.com
      repo: industrysolutions/leafy-bank-bian-accounts
      dockerfile: Dockerfile.accounts
    when:
      event:
        - pull_request
      paths:
        include:
          - "backend/accounts/**"
          - "Dockerfile.accounts"

  - name: build-check-transactions
    image: plugins/kaniko-ecr
    settings:
      no_push: true
      registry: 795250896452.dkr.ecr.us-east-1.amazonaws.com
      repo: industrysolutions/leafy-bank-bian-transactions
      dockerfile: Dockerfile.transactions
    when:
      event:
        - pull_request
      paths:
        include:
          - "backend/transactions/**"
          - "Dockerfile.transactions"

  - name: build-check-ledger
    image: plugins/kaniko-ecr
    settings:
      no_push: true
      registry: 795250896452.dkr.ecr.us-east-1.amazonaws.com
      repo: industrysolutions/leafy-bank-bian-ledger
      dockerfile: Dockerfile.ledger
    when:
      event:
        - pull_request
      paths:
        include:
          - "backend/ledger/**"
          - "Dockerfile.ledger"

---
