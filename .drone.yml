---
########################
# DEV PREVIEW (branch: integrate-payment-flow) — MULTICONTAINER single pod
#
# One pod: frontend (main, port 8080) + accounts/transactions/ledger sidecars on
# localhost ports 8001/8002/8003. Single Helm release `leafy-bank-bian-dev`,
# single ingress host. Separate ksec secret group `leafy-bank-bian-dev` → isolated
# dev DB so this link's writes never touch real staging data. Reuses the existing
# ECR repos with a -dev image tag.
#
# No path filtering: all four images publish + the one pod redeploys on every push
# to the branch so the dev link always reflects the branch tip. Triggered on
# integrate-payment-flow only — can never fire from staging or main.
#
# Port collision note: the three backends all default to 8080 in their Dockerfiles,
# but a pod shares one network namespace. Each sidecar therefore sets PORT
# (8001/8002/8003) and the Dockerfiles bind `--port ${PORT:-8080}`. The frontend
# keeps 8080 (Kanopy ingress requirement).
########################
kind: pipeline
type: kubernetes
name: staging-dev

trigger:
  branch:
    - integrate-payment-flow
  event:
    - push

steps:
  # ---------- publish (one image per container, reusing existing ECR repos) ----------
  - name: publish-frontend-dev
    image: plugins/kaniko-ecr
    settings:
      create_repository: true
      registry: 795250896452.dkr.ecr.us-east-1.amazonaws.com
      repo: industrysolutions/leafy-bank-bian-ui
      tags:
        - git-${DRONE_COMMIT_SHA:0:7}-dev
        - dev-latest
      dockerfile: Dockerfile.frontend
      build_args:
        - BIAN_MODEL_URL=https://leafy-bank-bian-model.industrysolutions.staging.corp.mongodb.com
        - NEXT_PUBLIC_CHARTS_ENV=staging
      access_key:
        from_secret: ecr_access_key
      secret_key:
        from_secret: ecr_secret_key

  - name: publish-accounts-dev
    image: plugins/kaniko-ecr
    settings:
      create_repository: true
      registry: 795250896452.dkr.ecr.us-east-1.amazonaws.com
      repo: industrysolutions/leafy-bank-bian-accounts
      tags:
        - git-${DRONE_COMMIT_SHA:0:7}-dev
        - dev-latest
      dockerfile: Dockerfile.accounts
      access_key:
        from_secret: ecr_access_key
      secret_key:
        from_secret: ecr_secret_key

  - name: publish-transactions-dev
    image: plugins/kaniko-ecr
    settings:
      create_repository: true
      registry: 795250896452.dkr.ecr.us-east-1.amazonaws.com
      repo: industrysolutions/leafy-bank-bian-transactions
      tags:
        - git-${DRONE_COMMIT_SHA:0:7}-dev
        - dev-latest
      dockerfile: Dockerfile.transactions
      access_key:
        from_secret: ecr_access_key
      secret_key:
        from_secret: ecr_secret_key

  - name: publish-ledger-dev
    image: plugins/kaniko-ecr
    settings:
      create_repository: true
      registry: 795250896452.dkr.ecr.us-east-1.amazonaws.com
      repo: industrysolutions/leafy-bank-bian-ledger
      tags:
        - git-${DRONE_COMMIT_SHA:0:7}-dev
        - dev-latest
      dockerfile: Dockerfile.ledger
      access_key:
        from_secret: ecr_access_key
      secret_key:
        from_secret: ecr_secret_key

  # ---------- deploy (one combined pod) ----------
  - name: deploy-dev-combined
    image: public.ecr.aws/kanopy/drone-helm:v3
    settings:
      chart: mongodb/web-app
      chart_version: 4.30.0
      add_repos: [mongodb=https://10gen.github.io/helm-charts]
      namespace: industrysolutions
      release: leafy-bank-bian-dev
      values_files: ["environment/staging-dev.yaml"]
      values:
        # Main container = frontend (port 8080, the ingress target)
        - "image.tag=git-${DRONE_COMMIT_SHA:0:7}-dev"
        - "image.repository=795250896452.dkr.ecr.us-east-1.amazonaws.com/industrysolutions/leafy-bank-bian-ui"
        - "ingress.enabled=true"
        - "ingress.hosts[0]=leafy-bank-bian-dev.industrysolutions.staging.corp.mongodb.com"
        - "mesh.enabled=true"
        - "resources.limits.cpu=500m"
        - "resources.limits.memory=512Mi"
        - "resources.requests.cpu=100m"
        - "resources.requests.memory=256Mi"
        # Sidecar images (name/containerPort/env/resources come from staging-dev.yaml).
        # Helm merges these per-index overrides with the values-file sidecarContainers[].
        - "sidecarContainers[0].image=795250896452.dkr.ecr.us-east-1.amazonaws.com/industrysolutions/leafy-bank-bian-accounts:git-${DRONE_COMMIT_SHA:0:7}-dev"
        - "sidecarContainers[1].image=795250896452.dkr.ecr.us-east-1.amazonaws.com/industrysolutions/leafy-bank-bian-transactions:git-${DRONE_COMMIT_SHA:0:7}-dev"
        - "sidecarContainers[2].image=795250896452.dkr.ecr.us-east-1.amazonaws.com/industrysolutions/leafy-bank-bian-ledger:git-${DRONE_COMMIT_SHA:0:7}-dev"
      api_server: https://api.staging.corp.mongodb.com
      kubernetes_token:
        from_secret: staging_kubernetes_token

---
